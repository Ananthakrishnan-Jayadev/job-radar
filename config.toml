# Job Radar settings. Safe to commit: no secrets here.
# Put API keys and your contact email in config.local.toml (git-ignored);
# see config.local.example.toml.

[general]
# SQLite file, relative to this folder.
database = "data/jobradar.db"
# Only jobs posted in the last this many days are kept: scans skip older
# postings, older ones already stored are deleted after each scan (never jobs
# you've saved, applied to or written notes on), and jobs with no posted date
# are hidden once they were first found this long ago. 0 keeps everything.
max_age_days = 30

[http]
# Sent with every request so sources can see who is calling.
# "{contact}" is replaced with general.contact from config.local.toml.
user_agent = "job-radar/0.1 (personal use; {contact})"
# Used only for sources that reject the honest agent above.
fallback_user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
timeout_seconds = 20
max_per_host = 2
page_delay_seconds = 0.5
# A source answering 429 (too many requests): wait this long, then 3x and 6x,
# before each of up to three retries (or as long as it asks, up to a minute),
# and pause this much before every later request to it in the same scan.
rate_limit_wait_seconds = 5.0
rate_limited_delay_seconds = 2.0

[workday]
# List every Canadian job when a board has at most this many;
# above it, search per saved search instead.
max_list = 400
max_details_per_scan = 15
delay_seconds = 1.0
# All companies' Workday sites share Workday's servers, which limit requests
# from your address across all of them: one request at a time, at least this
# many seconds apart, for every Workday board together. Workday's bot
# protection flagged the scan at 1.5; keep it gentle.
min_interval_seconds = 4.0
# Searched on boards over max_list (TD, RBC, BMO...). Saved searches marked
# "use for sources" replace this list once the web UI has them (phase 3).
search_terms = ["data", "machine learning", "artificial intelligence", "analyst", "analytics"]

[details]
# Job systems whose list has no descriptions (SmartRecruiters, Rippling,
# BambooHR, some SuccessFactors sites) fetch each job's page once, only for
# roles roles.toml wants, at most this many per board per scan.
max_per_board = 60

[smartrecruiters]
# Postings older than this are skipped (some boards keep 2017 postings).
max_age_days = 180

[ollama]
# Only for "jobradar levels --ai" / "Ask AI" on the Jobs page: works out the
# experience level of jobs the rules can't place. Cloud models need
# `ollama signin` once. Change the model here or with --model.
url = "http://localhost:11434"
model = "gemma4:31b-cloud"
timeout_seconds = 180
max_chars = 6000

[ai]
# Who "Ask AI" (and `jobradar levels --ai`) asks about job levels:
# "ollama" (the [ollama] section) or "claude" (the [claude] section).
provider = "ollama"

[claude]
# Claude through the Claude Code CLI (`claude -p`), counted against your
# Claude subscription's usage, not billed per token. Sign in once by running
# `claude` (laptop), or on a server set CLAUDE_CODE_OAUTH_TOKEN to the token
# `claude setup-token` prints. Model: haiku, sonnet, opus, or a full name.
command = "claude"
model = "sonnet"
timeout_seconds = 180
max_chars = 6000
