# Job Radar on a home server, reachable on your Wi-Fi at http://<server-ip>:8000.
# It has no login: keep it on your home network (don't forward this port on
# the router). Setup and updates: deploy/README.md.
services:
  jobradar:
    build: .
    image: jobradar:local
    container_name: jobradar
    restart: unless-stopped
    # Runs as your user, so files in ./data stay yours (set in .env; 1000 is
    # the first user on Ubuntu).
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    environment:
      TZ: America/Toronto
      # "Ask AI" about job levels (set in .env): Ollama's cloud key, or the
      # token `claude setup-token` prints, for Claude on your subscription.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Claude Code keeps its settings in a home folder; this one is in data/.
      HOME: /app/data/.home
    volumes:
      - ./data:/app/data
      - ./config.local.toml:/app/config.local.toml:ro
