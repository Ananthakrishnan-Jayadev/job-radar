[project]
name = "job-radar"
version = "0.1.0"
description = "Personal job radar: finds Canadian/Ontario roles from public company job feeds and tracks them."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobradar = "jobradar.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobradar*"]

[tool.setuptools.package-data]
jobradar = ["static/*"]
