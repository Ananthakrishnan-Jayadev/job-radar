[project]
name = "job-radar"
version = "0.1.0"
description = "Personal job radar: finds Canadian roles in public company job feeds and tracks them."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobradar = "jobradar.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobradar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
