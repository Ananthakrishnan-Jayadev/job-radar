    'cloud (engineer|architect|developer|specialist)',
    'solutions? architect',
    '(technical|tech|engineering) lead',
    'engineering manager',
    '(director|head|vp|vice president) (of )?engineering',
    'architecte (logiciel|solution|infonuagique|technique)',
    'ingenieur(e)? (logiciel|en logiciel|devops|infonuagique|fiabilite|systemes|en developpement)',
    '(qa|test|quality) (analyst|automation|engineer)',
    'sdet',
