# Which job titles Job Radar keeps (version 2).
#
# Built 2026-10-26 from the 6,941 distinct titles in the database and tuned
# against them; see docs/decisions/2026-10-26-role-keywords.md.
#
# How a title is judged (all patterns are regular expressions matched against
# the title lowercased, accents removed, punctuation turned into spaces, with a
# space at each end; so " ai " means the word "ai"):
#   1. Any `exclude` pattern: out (other job functions: sales, advisors...).
#   2. Any pattern of an enabled category: in, as that category, unless
#        - the only category is "ai" and no `ai_role` pattern matches
#          ("AI Growth Ops" is out, "AI Engineer" is in), or
#        - a `soft` pattern matches and no `strong` one does: then the title
#          goes to "adjacent" instead ("Manager, Data Governance" is adjacent,
#          "Data Governance Engineer" is data).
#   3. Otherwise an `adjacent` pattern: adjacent.
#   4. Otherwise: out.
# Edit freely; add a pattern, run `.venv/bin/pytest tests/test_roles.py`.

[categories.software]
label = "Software development"
enabled = true
include = [
