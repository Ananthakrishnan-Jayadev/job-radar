    'fullstack',
    '(mobile|ios|android|web|platform|infrastructure|cloud|devops|devsecops|site reliability|reliability|systems?|embedded|firmware|application|applications|api|integration|automation|test automation|qa|quality assurance|security|gameplay|game|graphics|tools|build|release|compiler|distributed systems|network automation|salesforce|sap|frontend|backend|java|python|\.net|golang|rust|react|node) (engineer|engineering|developer|architect|programmer|lead)',
    ' sre ',
