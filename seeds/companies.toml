# Starting company list, from docs/05-seed-companies.md (feeds verified 2026-10-26).
#
# Each company has one or more boards: { system, slug } where slug is the
# board name on that system, or the full careers-site URL for Workday.
# confirmed = false marks a slug match that may belong to a different company;
# confirm it in the app before trusting its jobs.
# enabled = false keeps a board on record without scanning it.
#
# Load with: jobradar seed   (safe to run again; nothing is duplicated)

